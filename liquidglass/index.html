<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>情心 · 慢读古典</title>
  <link rel="canonical" href="../">
  <script>
    // 旧地址（两套界面并存时的 kyne/、liquidglass/）：带着 #/… 路由跳到站点根目录，不留历史项。
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('qingxin:prefs')) || {};
        if (prefs.theme === 'dark' || prefs.theme === 'light') document.documentElement.setAttribute('data-theme', prefs.theme);
      } catch (e) {}
      // 旧版 Worker（qingxin-v1…v9）缓存里的根目录可能还是界面选择页，它会把 #/… 转回这里：
      // 从根目录转来时改去 ../?（缓存里没有的地址，只能取网络上的新页面），免得来回跳。
      var fromRoot = false;
      try {
        var root = new URL('../', window.location.href).pathname;
        var from = new URL(document.referrer);
        fromRoot = from.origin === window.location.origin
          && (from.pathname === root || from.pathname === root + 'index.html');
      } catch (e) {}
      window.location.replace((fromRoot ? '../?' : '../') + window.location.hash);
    })();
  </script>
  <style>
    /* 跳转前的一瞬间与根目录同底色，不闪白；配色取自 assets/css/glass.css */
    :root { color-scheme: light; --paper: #F4F2ED; --ink: #1F1D1A; --link: #57534E; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --paper: #191D22; --ink: #ECE8E0; --link: #B7C7D8; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #191D22; --ink: #ECE8E0; --link: #B7C7D8; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", serif;
      text-align: center;
    }
    a { color: var(--link); }
  </style>
</head>
<body>
  <noscript><p>情心已搬到新地址：<a href="../">前往情心</a></p></noscript>
</body>
</html>

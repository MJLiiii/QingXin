<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>情心 · 慢读古典</title>
  <link rel="canonical" href="../">
  <script>
    // 旧地址（两套界面并存时的 kyne/、liquidglass/）：带着 #/… 路由跳到站点根目录，不留历史项。
    (function () {
      // 跳转前一瞬间的底色：未到期的手动选择照用，否则按钟点 18:00–6:00 粗算夜读（等价于
      // assets/js/daylight.js 的 themeFor(prefs, null, now)；日出日落留给根目录的首帧脚本，这里不再抄一份）。
      var prefs = {};
      try { prefs = JSON.parse(localStorage.getItem('qingxin:prefs')) || {}; } catch (e) {}
      try {
        var now = Date.now();
        var until = prefs.themeUntil;
        var hour = new Date(now).getHours();
        var theme = (prefs.theme === 'dark' || prefs.theme === 'light') && now < until && until - now <= 1728e5
          ? prefs.theme : (hour >= 18 || hour < 6 ? 'dark' : '');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
      // 旧版 Worker（qingxin-v1…v9）缓存里的根目录可能还是界面选择页，它会把 #/… 转回这里：
      // 从根目录转来时改去 ../?（缓存里没有的地址，只能取网络上的新页面），免得来回跳。
      var fromRoot = false;
      try {
        var root = new URL('../', window.location.href).pathname;
        var from = new URL(document.referrer);
        fromRoot = from.origin === window.location.origin
          && (from.pathname === root || from.pathname === root + 'index.html');
      } catch (e) {}
      window.location.replace((fromRoot ? '../?' : '../') + window.location.hash);
    })();
  </script>
  <style>
    /* 跳转前的一瞬间与根目录同底色，不闪白；配色取自 assets/css/glass.css */
    :root { color-scheme: light; --paper: #FAF4ED; --ink: #575279; --link: #60567A; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { color-scheme: dark; --paper: #232136; --ink: #E0DEF4; --link: #C4A7E7; }
    }
    :root[data-theme="dark"] { color-scheme: dark; --paper: #232136; --ink: #E0DEF4; --link: #C4A7E7; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", serif;
      text-align: center;
    }
    a { color: var(--link); }
  </style>
</head>
<body>
  <noscript><p>情心已搬到新地址：<a href="../">前往情心</a></p></noscript>
</body>
</html>

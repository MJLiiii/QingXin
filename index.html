<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>情心 · 慢读古典</title>
  <meta name="description" content="情心 — 水墨留白的古诗文赏读。原文、注释、译文、赏析、创作背景，逐层深入。">
  <script>
    // 首帧前应用阅读偏好（主题 / 字号 / 竖排），避免闪烁；键名与 assets/js/reader.js 一致。
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('qingxin:prefs')) || {};
        var root = document.documentElement;
        if (prefs.theme === 'dark' || prefs.theme === 'light') root.setAttribute('data-theme', prefs.theme);
        var scale = Number(prefs.scale);
        if (scale >= 0.8 && scale <= 1.5) root.style.setProperty('--reading-scale', String(scale));
        if (prefs.vertical === true) root.setAttribute('data-vertical', '1');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- ============ 页眉 ============ -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="#/home" data-nav="home" aria-label="返回首页">
        <span class="brand__mark"></span>
        <span class="brand__name">情心</span>
      </a>
      <nav class="site-nav">
        <a class="site-nav__link" href="#/list" data-nav="list">诗集</a>
        <a class="site-nav__link" href="#/authors" data-nav="authors">诗人</a>
        <a class="site-nav__link" href="#/about" data-nav="about">关于</a>
        <button class="site-nav__theme" type="button" data-action="theme" aria-pressed="false" aria-label="夜间模式">夜读</button>
      </nav>
    </div>
  </header>

  <!-- ============ 页面容器（内容由 assets/js/*.js 按数据渲染，不写死诗文） ============ -->
  <main class="page" id="page-home"></main>
  <main class="page" id="page-list"></main>
  <main class="page" id="page-poem"></main>
  <main class="page" id="page-author"></main>
  <main class="page" id="page-authors"></main>
  <main class="page" id="page-about"></main>

  <!-- 首屏加载态：数据就绪后被替换 -->
  <div id="boot" class="boot"><span class="boot__mark">情心</span></div>

  <!-- ============ 页脚 ============ -->
  <footer class="site-footer">
    <div class="site-footer__mark">情心</div>
    <div class="site-footer__tagline">慢 读 古 典 · 一 日 一 诗</div>
  </footer>

  <script type="module" src="assets/js/app.js"></script>
  <script>
    // 离线/跨刷新缓存；相对路径注册，作用域随部署子路径（/QingXin/）。特性检测 + 静默失败。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
